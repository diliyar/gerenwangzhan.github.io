<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 迪力亚尔的个人博客</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="login-container">
        <div class="login-box">
            <h2><i class="fas fa-shield-alt"></i> 管理后台登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">用户名或邮箱</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> 登录
                </button>
            </form>
            <div class="login-tips">
                <p><strong>默认管理员账号：</strong></p>
                <p>用户名：admin</p>
                <p>密码：admin123</p>
            </div>
        </div>
    </div>

    <!-- 管理后台主界面 -->
    <div id="admin-dashboard" class="admin-container" style="display: none;">
        <!-- 顶部导航 -->
        <header class="admin-header">
            <div class="header-left">
                <h1><i class="fas fa-cog"></i> 管理后台</h1>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <span id="current-user">管理员</span>
                    <button id="logout-btn" class="btn-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </header>

        <!-- 侧边栏 -->
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-section="dashboard">
                        <a href="#"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
                    </li>
                    <li class="nav-item" data-section="posts">
                        <a href="#"><i class="fas fa-file-alt"></i> 文章管理</a>
                    </li>
                    <li class="nav-item" data-section="images">
                        <a href="#"><i class="fas fa-images"></i> 图片管理</a>
                    </li>
                    <li class="nav-item" data-section="users">
                        <a href="#"><i class="fas fa-users"></i> 用户管理</a>
                    </li>
                    <li class="nav-item" data-section="categories">
                        <a href="#"><i class="fas fa-tags"></i> 分类管理</a>
                    </li>
                    <li class="nav-item" data-section="settings">
                        <a href="#"><i class="fas fa-cogs"></i> 系统设置</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区域 -->
        <main class="admin-main">
            <!-- 仪表盘 -->
            <div id="dashboard-section" class="content-section active">
                <h2>仪表盘</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="total-users">0</h3>
                            <p>用户总数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="total-posts">0</h3>
                            <p>文章总数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-images"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="total-images">0</h3>
                            <p>图片总数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-eye"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="today-views">0</h3>
                            <p>今日访问</p>
                        </div>
                    </div>
                </div>
                
                <div class="recent-activity">
                    <h3>最近活动</h3>
                    <div id="recent-posts" class="activity-list">
                        <!-- 动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 文章管理 -->
            <div id="posts-section" class="content-section">
                <div class="section-header">
                    <h2>文章管理</h2>
                    <button id="new-post-btn" class="btn-primary">
                        <i class="fas fa-plus"></i> 新建文章
                    </button>
                </div>
                
                <div class="filter-bar">
                    <select id="status-filter">
                        <option value="">全部状态</option>
                        <option value="published">已发布</option>
                        <option value="draft">草稿</option>
                    </select>
                    <select id="category-filter">
                        <option value="">全部分类</option>
                        <option value="growth">成长经历</option>
                        <option value="gaming">游戏生涯</option>
                        <option value="interests">兴趣爱好</option>
                        <option value="photography">摄影作品</option>
                    </select>
                    <button id="refresh-posts" class="btn-secondary">刷新</button>
                </div>

                <div class="table-container">
                    <table id="posts-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="select-all-posts"></th>
                                <th>标题</th>
                                <th>分类</th>
                                <th>状态</th>
                                <th>作者</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 图片管理 -->
            <div id="images-section" class="content-section">
                <div class="section-header">
                    <h2>图片管理</h2>
                    <button id="upload-image-btn" class="btn-primary">
                        <i class="fas fa-upload"></i> 上传图片
                    </button>
                </div>

                <div class="upload-area" id="image-upload-area" style="display: none;">
                    <input type="file" id="image-input" accept="image/*" multiple>
                    <div class="upload-controls">
                        <button id="confirm-upload" class="btn-primary">确认上传</button>
                        <button id="cancel-upload" class="btn-secondary">取消</button>
                    </div>
                </div>

                <div class="image-grid" id="images-grid">
                    <!-- 动态加载 -->
                </div>
            </div>

            <!-- 用户管理 -->
            <div id="users-section" class="content-section">
                <div class="section-header">
                    <h2>用户管理</h2>
                </div>

                <div class="table-container">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>姓名</th>
                                <th>角色</th>
                                <th>状态</th>
                                <th>注册时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 分类管理 -->
            <div id="categories-section" class="content-section">
                <div class="section-header">
                    <h2>分类管理</h2>
                    <button id="new-category-btn" class="btn-primary">
                        <i class="fas fa-plus"></i> 新建分类
                    </button>
                </div>

                <div class="categories-list" id="categories-list">
                    <!-- 动态加载 -->
                </div>
            </div>

            <!-- 系统设置 -->
            <div id="settings-section" class="content-section">
                <h2>系统设置</h2>
                <form id="settings-form">
                    <div class="form-group">
                        <label for="site-name">网站名称</label>
                        <input type="text" id="site-name" name="siteName" value="迪力亚尔的个人博客">
                    </div>
                    <div class="form-group">
                        <label for="site-description">网站描述</label>
                        <textarea id="site-description" name="siteDescription" rows="3">分享成长经历、游戏生涯和兴趣爱好</textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="allow-registration" name="allowRegistration" checked>
                            允许用户注册
                        </label>
                    </div>
                    <div class="form-group">
                        <label for="max-upload-size">最大上传文件大小 (MB)</label>
                        <input type="number" id="max-upload-size" name="maxUploadSize" value="10" min="1" max="100">
                    </div>
                    <button type="submit" class="btn-primary">保存设置</button>
                </form>
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modal-body">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
